<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="mediaqueries.css">
</head>
<body>
    <nav id="desktop-nav">
        <div class="logo">Tee What</div>
        <div>
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#Contact">Contact</a></li>
            </ul>
        </div>
    </nav>
    <nav id="hamburger-nav">
        <div class="logo">Tee What</div>
        <div class="hamburger-menu">
            <div class="hamburger-icon" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="menu-links">
                <li><a href="#about" onclick="toggleMenu()">About</a></li>
                <li><a href="#experience" onclick="toggleMenu()">Experience</a></li>
                <li><a href="#projects" onclick="toggleMenu()">Projects</a></li>
                <li><a href="#Contact" onclick="toggleMenu()">Contact</a></li>
            </div>
        </div>
    </nav>
    <section id="profile">
        <div class="section__pic-container">
            <img src="./assets/pic1_1.jpg" alt="my profile picture">
        </div>
        <div class="section_text">
            <p class="section_text__p1">Hello I'm</p>
            <h1 class="title">Tee</h1>
            <p class="section_text__p2">Software engineer</p>
            <div class="bt-container">
                <button class="btn btn-color-2" onclick="window.open('./assets/')">Download CV</button>
                <button class="btn btn-color-2" onclick="location.href='./#contact'">Contact info</button>
            </div>
            <div id="socials-container">
                <img src="./assets/linkedin-logo.jpg" alt="my linkedin profile"
                class="icon" onclick="location.href='https://linkedin.com/'">
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
